# Builds the Gathering demo image and commits its tag to deploy/manifest/10-deployment.yaml.
# Argo CD (trajectory/gathering_demo/deploy/argo-app.yaml) pulls that commit; CI has no cluster access.
name: gathering-demo

on:
  push:
    branches: [main]
    paths:
      - trajectory/gathering_demo/**
      - "!trajectory/gathering_demo/deploy/**"
      - "!**.md"
      - .github/workflows/gathering-demo.yml
  workflow_dispatch:

# One run at a time, so tag bumps land in order. A queued run is replaced by a newer one.
concurrency:
  group: gathering-demo
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/uitprojects/cs2207-gathering-demo
  MANIFEST: trajectory/gathering_demo/deploy/manifest/10-deployment.yaml

jobs:
  build-and-bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: trajectory/gathering_demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/UITProjects/cs2207
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Each attempt starts from the latest main: this run's checkout may predate the previous bump.
      - name: Commit new image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            sed -i -E "s|^( *image: ${IMAGE}:).*|\1${TAG}|" "$MANIFEST"
            if git diff --quiet; then
              echo "Manifest already uses ${TAG}"
              exit 0
            fi
            git commit -am "Gathering demo: deploy ${TAG} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not push the tag bump after 3 attempts" >&2
          exit 1
